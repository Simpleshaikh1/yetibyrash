# Local services for development. Start with: docker compose up -d
name: yetibyrash

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: yetibyrash
      POSTGRES_PASSWORD: yetibyrash
      POSTGRES_DB: yetibyrash
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yetibyrash -d yetibyrash"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Catches every email the app sends. Inbox at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21.0
    ports:
      - "8025:8025"
      - "1025:1025"

  # Photo storage (S3-compatible) is added in M2.

volumes:
  pgdata:
