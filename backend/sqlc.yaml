# sqlc turns the SQL in queries/ into typed Go in internal/db/sqlc.
# Generate (needs Docker): docker run --rm -v "${PWD}:/src" -w /src sqlc/sqlc:1.27.0 generate
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: queries
    gen:
      go:
        package: sqlc
        out: internal/db/sqlc
        sql_package: pgx/v5
        emit_json_tags: true
        emit_empty_slices: true
