<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;0,700;1,500&amp;family=Jost:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#9A4F5B;text-decoration:none}a:hover{color:#3A2420}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 1100px; box-sizing: border-box; background: #F7E7E2; color: #3A2420; font-family: 'Jost', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">

  <header style="display: flex; align-items: center; gap: 8px; padding: 16px 16px 6px;">
    <a href="Home.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: grid; place-items: center; color: #3A2420;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
    </a>
    <h1 style="margin: 0; flex: 1; font-family: 'Bodoni Moda', Georgia, serif; font-weight: 500; font-size: 26px;">Clothing</h1>
    <a href="Bag.dc.html" aria-label="Bag, 2 items" style="width: 44px; height: 44px; display: grid; place-items: center; color: #3A2420;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>
    </a>
  </header>

  <div style="display: flex; gap: 8px; padding: 6px 16px 0; overflow: hidden;">
    <sc-for list="{{ chips }}" as="c" hint-placeholder-count="4">
      <button onClick="{{ c.pick }}" style="{{ c.style }}">{{ c.label }}</button>
    </sc-for>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 4px;">
    <span style="font-size: 14px; color: #5A3E38;">{{ countLabel }}</span>
    <div style="display: flex; gap: 8px;">
      <button style="min-height: 40px; border: 1px solid #EAC8BF; background: #FFF8F5; color: #3A2420; border-radius: 999px; padding: 0 14px; font-size: 14px; display: flex; align-items: center; gap: 6px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>Filter · 2
      </button>
      <button style="min-height: 40px; border: 1px solid #EAC8BF; background: #FFF8F5; color: #3A2420; border-radius: 999px; padding: 0 14px; font-size: 14px;">Sort: Newest</button>
    </div>
  </div>

  <div style="display: flex; gap: 6px; padding: 6px 16px 0; flex-wrap: wrap;">
    <span style="background: #3A2420; color: #FFF8F5; font-size: 12.5px; border-radius: 999px; padding: 5px 10px;">Everyday ✕</span>
    <span style="background: #3A2420; color: #FFF8F5; font-size: 12.5px; border-radius: 999px; padding: 5px 10px;">₦10k–₦30k ✕</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 14px 16px 0;">
    <sc-for list="{{ products }}" as="p" hint-placeholder-count="6">
      <a href="Product.dc.html" style="background: #FFF8F5; border-radius: 18px; overflow: hidden; color: #3A2420; display: flex; flex-direction: column;">
        <span style="aspect-ratio: 1; background: #F0D9D2; display: grid; place-items: center; position: relative; color: #76574F; font-size: 12px;">
          Photo
          <span aria-hidden="true" style="position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; border-radius: 999px; background: #FFF8F5; display: grid; place-items: center; color: #3A2420;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg></span>
          <span style="position: absolute; bottom: 8px; left: 8px; right: 8px; min-height: 34px; border-radius: 999px; background: #3A2420; color: #FFF8F5; display: grid; place-items: center; font-size: 13px; font-weight: 500;">Quick add +</span>
        </span>
        <span style="padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 14px; line-height: 1.3;">{{ p.name }}</span>
          <span style="font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums;">{{ p.price }}</span>
          <span style="font-size: 12px; color: #76574F;">{{ p.note }}</span>
        </span>
      </a>
    </sc-for>
  </div>

  <div style="flex: 1;"></div>

  <div style="margin: 0 16px 16px; background: #3A2420; color: #FFF8F5; border-radius: 22px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px;">
    <span style="font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #F2C6B9;">Filter sheet (slides up)</span>
    <span style="font-size: 14px; line-height: 1.5; color: #F2DCD5;">Everyday / Premium · Price: under ₦10k, ₦10k–30k, ₦30k–80k, ₦80k+ · Colour · Material · Size · "Show 18 items" button</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { cat: 'All' }; }
  renderVals() {
    const on = 'flex: none; min-height: 40px; border: 0; border-radius: 999px; padding: 0 16px; font-size: 14px; font-weight: 600; background: #3A2420; color: #FFF8F5;';
    const off = 'flex: none; min-height: 40px; border: 1px solid #EAC8BF; border-radius: 999px; padding: 0 16px; font-size: 14px; background: #FFF8F5; color: #3A2420;';
    const cats = ['All', 'Joggers', 'Tops', 'Co-ords'];
    const all = [
      { name: 'Ribbed lounge joggers', price: '₦14,500', note: '★ 4.8 (32) · 4 colours', cat: 'Joggers' },
      { name: 'Cropped baby tee', price: '₦9,000', note: '★ 4.6 (21) · Pre-order', cat: 'Tops' },
      { name: 'Ribbed jogger co-ord set', price: '₦24,000', note: '★ 4.9 (14) · New', cat: 'Co-ords' },
      { name: 'Wide-leg lounge pants', price: '₦16,000', note: '★ 4.7 (9) · Only 4 left', cat: 'Joggers' },
      { name: 'Square-neck cami top', price: '₦8,500', note: '★ 4.5 (12) · 3 colours', cat: 'Tops' },
      { name: 'Biker short set', price: '₦15,500', note: '★ 4.8 (7) · New', cat: 'Co-ords' }
    ];
    const list = this.state.cat === 'All' ? all : all.filter(p => p.cat === this.state.cat);
    return {
      chips: cats.map(c => ({ label: c, style: c === this.state.cat ? on : off, pick: () => this.setState({ cat: c }) })),
      products: list,
      countLabel: list.length + (list.length === 1 ? ' item' : ' items')
    };
  }
}
</script>
</body>
</html>
