<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bag</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;0,700;1,500&amp;family=Jost:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#9A4F5B;text-decoration:none}a:hover{color:#3A2420}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #5A3E38; color: #3A2420; font-family: 'Jost', system-ui, sans-serif; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden;">
  <a href="Product.dc.html" aria-label="Close bag" style="flex: 1; display: block;"></a>
  <section style="background: #F7E7E2; border-radius: 28px 28px 0 0; padding: 10px 16px 20px; display: flex; flex-direction: column; gap: 16px;">
    <span aria-hidden="true" style="align-self: center; width: 44px; height: 5px; border-radius: 999px; background: #EAC8BF;"></span>
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <h1 style="margin: 0; font-family: 'Bodoni Moda', Georgia, serif; font-weight: 500; font-size: 26px;">Your bag</h1>
      <span style="font-size: 14px; color: #5A3E38;">{{ countLabel }}</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <sc-for list="{{ items }}" as="it" hint-placeholder-count="2">
        <div style="background: #FFF8F5; border-radius: 18px; padding: 12px; display: flex; gap: 12px;">
          <span style="width: 84px; height: 84px; border-radius: 12px; background: #F0D9D2; flex: none;"></span>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
            <span style="font-size: 15px;">{{ it.name }}</span>
            <span style="font-size: 13px; color: #76574F;">{{ it.opts }}</span>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: auto;">
              <div style="display: flex; align-items: center; border: 1px solid #EAC8BF; border-radius: 999px;">
                <button aria-label="Fewer" onClick="{{ it.minus }}" style="width: 40px; height: 40px; border: 0; background: transparent; font-size: 18px; color: #3A2420;">−</button>
                <span style="min-width: 18px; text-align: center; font-variant-numeric: tabular-nums;">{{ it.qty }}</span>
                <button aria-label="More" onClick="{{ it.plus }}" style="width: 40px; height: 40px; border: 0; background: transparent; font-size: 18px; color: #3A2420;">+</button>
              </div>
              <b style="font-size: 15px; font-variant-numeric: tabular-nums;">{{ it.line }}</b>
            </div>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="background: #EAC8BF; border-radius: 14px; padding: 12px 14px; font-size: 14px; color: #3A2420;">Add <b>₦13,500</b> more for free delivery in Lagos.</div>

    <div style="display: flex; flex-direction: column; gap: 6px; font-size: 15px;">
      <div style="display: flex; justify-content: space-between;"><span>Subtotal</span><b style="font-variant-numeric: tabular-nums;">{{ subtotal }}</b></div>
      <div style="display: flex; justify-content: space-between; color: #5A3E38;"><span>Delivery</span><span>Worked out at checkout</span></div>
    </div>

    <a href="Checkout.dc.html" style="height: 54px; border-radius: 999px; background: #3A2420; color: #FFF8F5; display: grid; place-items: center; font-size: 16px; font-weight: 500;">Checkout · {{ subtotal }}</a>
    <a href="Shop.dc.html" style="text-align: center; font-size: 15px; padding: 6px;">Keep shopping</a>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { q: [1, 1] }; }
  renderVals() {
    const base = [
      { name: 'Ribbed lounge joggers', opts: 'Espresso · M', price: 14500 },
      { name: 'Pearl drop earrings', opts: 'Gold tone', price: 12000 }
    ];
    const q = this.state.q;
    const set = (i, v) => { const n = q.slice(); n[i] = Math.max(0, Math.min(9, v)); this.setState({ q: n }); };
    const fmt = n => '₦' + n.toLocaleString('en-NG');
    const items = base.map((b, i) => ({ ...b, qty: q[i], line: fmt(b.price * q[i]), minus: () => set(i, q[i] - 1), plus: () => set(i, q[i] + 1) })).filter(x => x.qty > 0);
    const count = q.reduce((a, b) => a + b, 0);
    return {
      items: items,
      subtotal: fmt(base.reduce((s, b, i) => s + b.price * q[i], 0)),
      countLabel: count + (count === 1 ? ' item' : ' items')
    };
  }
}
</script>
</body>
</html>
