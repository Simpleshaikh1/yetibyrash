<!-- @dsCard group="Actions" height=240 subtitle="Primary, outline, Paystack, admin" -->
<div class="demo">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@500&family=Jost:wght@400;500;600&display=swap">
  <style>
    body{margin:0;background:var(--ground-shop)}
    .demo{font-family:var(--font-body);display:flex;flex-wrap:wrap;gap:var(--space-5);padding:var(--space-5);color:var(--ink)}
    .col{display:flex;flex-direction:column;gap:var(--space-3);width:300px}
    .btn{height:var(--button-height);border-radius:var(--radius-pill);display:flex;align-items:center;justify-content:center;gap:var(--space-2);font:500 16px/20px var(--font-body);border:0}
    .primary{background:var(--ink);color:var(--ink-on-dark)}
    .outline{background:var(--surface-card);color:var(--ink);border:1px solid var(--line-shop)}
    .note{font-size:13px;line-height:18px;color:var(--ink-secondary);text-align:center}
    .admin{display:flex;gap:var(--space-2);background:var(--ground-admin);padding:var(--space-4);border-radius:var(--radius-panel)}
    .abtn{height:44px;padding:0 18px;border-radius:var(--radius-field);font:500 15px var(--font-body);border:0}
    .a1{background:var(--ink);color:var(--ink-on-dark)}
    .a2{background:var(--surface-white);color:var(--ink-admin);border:1px solid var(--line-field)}
  </style>
  <div class="col">
    <button class="btn primary">Add to bag · ₦14,500</button>
    <button class="btn outline">Continue shopping</button>
  </div>
  <div class="col">
    <button class="btn primary"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Pay ₦29,000 with Paystack</button>
    <span class="note">Card, bank transfer or USSD on Paystack's secure page.</span>
    <div class="admin"><button class="abtn a1">Save product</button><button class="abtn a2">Preview on phone</button></div>
  </div>
</div>
