<!-- @dsCard group="Shop" height=340 subtitle="Everyday, Premium, on sale" -->
<div class="demo">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap">
  <style>
    body{margin:0;background:var(--ground-shop)}
    .demo{font-family:var(--font-body);display:flex;gap:var(--space-3);padding:var(--space-5);color:var(--ink)}
    .card{width:175px;background:var(--surface-card);border-radius:var(--radius-card);overflow:hidden;display:flex;flex-direction:column}
    .ph{aspect-ratio:1;background:var(--surface-soft);position:relative}
    .badge{position:absolute;top:10px;left:10px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;padding:4px 8px;border-radius:var(--radius-pill)}
    .ev{background:var(--surface-card);color:var(--ink)}
    .pr{background:var(--ink);color:var(--accent-rose-light)}
    .sale{background:var(--accent-rose);color:#FFFFFF}
    .heart{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:var(--radius-pill);background:var(--surface-card);display:grid;place-items:center}
    .quick{position:absolute;left:8px;right:8px;bottom:8px;height:34px;border-radius:var(--radius-pill);background:var(--ink);color:var(--ink-on-dark);display:grid;place-items:center;font-size:13px;font-weight:500}
    .meta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
    .nm{font-size:14px;line-height:1.3}
    .price{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
    s{color:var(--ink-muted);font-weight:400;margin-left:4px}
    .sm{font-size:12px;color:var(--ink-secondary)}
  </style>
  <div class="card"><div class="ph"><span class="badge ev">Everyday</span><span class="heart"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg></span><span class="quick">Quick add +</span></div>
    <div class="meta"><span class="nm">Ribbed lounge joggers</span><span class="price">₦14,500</span><span class="sm">★ 4.8 (32) · 4 colours</span></div></div>
  <div class="card"><div class="ph"><span class="badge pr">Premium</span></div>
    <div class="meta"><span class="nm">Gold mesh ladies' watch</span><span class="price">₦64,000</span><span class="sm">★ 4.9 (11)</span></div></div>
  <div class="card"><div class="ph"><span class="badge sale">20% off</span></div>
    <div class="meta"><span class="nm">Mini structured tote</span><span class="price">₦25,600<s>₦32,000</s></span><span class="sm">★ 4.7 (9) · Only 4 left</span></div></div>
</div>
